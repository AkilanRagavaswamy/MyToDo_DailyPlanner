<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif; font-size: 14px">
<dc-import name="TitleBar" theme="{{theme}}" hint-size="100%,48px"></dc-import>
<div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
<dc-import name="NavPane" theme="{{theme}}" active="calendar" hint-size="248px,752px"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; background: {{t.surface2}}; border-top-left-radius: 8px; border: 1px solid {{t.border}}; box-sizing: border-box; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px; flex-wrap: wrap; border-bottom: 1px solid {{t.border}}">
<h1 style="margin: 0; font-size: 22px; font-weight: 600; margin-right: 8px">November 2026</h1>
<button style="font: inherit; padding: 5px 12px; border-radius: 4px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}">Today</button>
<button aria-label="Previous week" style="width: 32px; height: 32px; border-radius: 4px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button aria-label="Next week" style="width: 32px; height: 32px; border-radius: 4px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<span style="color: {{t.text2}}; font-size: 13px">9 – 15 Nov</span>
<div style="flex: 1 1 auto"></div>
<div role="tablist" aria-label="Calendar view" style="display: flex; padding: 2px; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.border}}">
<button role="tab" aria-selected="false" style="font: inherit; font-size: 13px; padding: 5px 12px; border: 0; border-radius: 4px; background: transparent; color: {{t.text}}">Day</button>
<button role="tab" aria-selected="false" style="font: inherit; font-size: 13px; padding: 5px 12px; border: 0; border-radius: 4px; background: transparent; color: {{t.text}}">Work week</button>
<button role="tab" aria-selected="true" style="font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border: 0; border-radius: 4px; background: {{t.accentSoft}}; color: {{t.accent}}">Week</button>
<a role="tab" aria-selected="false" href="{{monthHref}}" style="font-size: 13px; padding: 5px 12px; border-radius: 4px; color: {{t.text}}; text-decoration: none">Month</a>
</div>
<button style="font: inherit; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 4px; border: 0; background: {{t.accentFill}}; color: {{t.onAccent}}; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New event</button>
</div>
<div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
<aside aria-label="Unscheduled tasks" style="flex: 1 1 200px; max-width: 230px; box-sizing: border-box; padding: 14px; border-right: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600">Unscheduled tasks</h2>
<p style="margin: 0 0 4px; font-size: 12px; color: {{t.text2}}">Drag onto the calendar to block time. New blocks are 30 minutes.</p>
<sc-for list="{{pool}}" as="p" hint-placeholder-count="5">
<div style="{{p.style}}">
<svg width="12" height="12" viewBox="0 0 24 24" fill="{{t.text2}}" aria-hidden="true"><path d="M9 5h2v2H9zM13 5h2v2h-2zM9 11h2v2H9zM13 11h2v2h-2zM9 17h2v2H9zM13 17h2v2h-2z"></path></svg>
<span style="flex: 1; min-width: 0">{{p.title}}</span>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{t.text2}}">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{t.meetFill}}; border: 1px solid {{t.meetText}}"></span>Meeting</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{t.accentSoft}}; border: 1px solid {{t.accent}}"></span>Focus block</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{t.amberSoft}}; border: 1px solid {{t.amber}}"></span>Personal</span>
</div>
</aside>
<div style="flex: 999 1 520px; min-width: 0; overflow-x: auto; padding: 0 12px 12px 0; box-sizing: border-box">
<div style="min-width: 640px">
<div style="display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); border-bottom: 1px solid {{t.border}}">
<span></span>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 12px; color: {{t.text2}}">{{d.dow}}</span>
<span style="{{d.numStyle}}">{{d.num}}</span>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); height: 441px">
<div style="position: relative">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="11">
<span style="position: absolute; right: 8px; top: {{h.top}}px; font-size: 11px; color: {{t.text2}}; transform: translateY(-6px)">{{h.label}}</span>
</sc-for>
</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="position: relative; border-left: 1px solid {{t.border}}; background-image: repeating-linear-gradient(to bottom, {{t.border}} 0 1px, transparent 1px 40px); background-color: {{d.bg}}">
<sc-for list="{{d.ev}}" as="e" hint-placeholder-count="3">
<div style="{{e.style}}"><strong style="font-weight: 600; display: block">{{e.title}}</strong><span>{{e.time}}</span></div>
</sc-for>
<sc-if value="{{d.now}}" hint-placeholder-val="{{false}}"><div aria-label="Now, 11:05" style="position: absolute; left: 0; right: 0; top: 123px; height: 2px; background: {{t.danger}}"></div></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: {bg:'#EEF2EF',surface:'#FFFFFF',surface2:'#F6F8F6',hover:'#E9EEEA',border:'#DCE2DE',text:'#1A1F1C',text2:'#56605A',accent:'#17784C',accentFill:'#187A4E',onAccent:'#FFFFFF',accentSoft:'#E2F2E9',amber:'#8F5500',amberSoft:'#FDF1DC',danger:'#B42318',dangerSoft:'#FDECEA',meetFill:'#E5EEFB',meetText:'#1D4E9A'},
      dark: {bg:'#191C1A',surface:'#232725',surface2:'#2B302D',hover:'#323834',border:'#3A413C',text:'#F1F4F2',text2:'#B2BBB5',accent:'#72D9A6',accentFill:'#4CC38A',onAccent:'#05130C',accentSoft:'#1C3A2B',amber:'#F4BC5C',amberSoft:'#3A2C12',danger:'#FF9A8F',dangerSoft:'#3D1F1C',meetFill:'#1F3150',meetText:'#AFCBF5'}
    };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const t = T[theme];
    const H = 40;
    const kinds = { m: [t.meetFill, t.meetText], f: [t.accentSoft, t.accent], p: [t.amberSoft, t.amber] };
    const ev = (start, end, title, time, k, opt) => {
      const o = opt || {};
      const [bg, fg] = kinds[k];
      const top = (start - 8) * H, h = (end - start) * H;
      let s = 'position: absolute; top: ' + (top + 1) + 'px; height: ' + (h - 2) + 'px; left: ' + (o.left || '3px') + '; right: ' + (o.right || '3px') + '; box-sizing: border-box; padding: 3px 6px; border-radius: 4px; background: ' + bg + '; color: ' + fg + '; font-size: 11px; line-height: 1.3; overflow: hidden;';
      if (o.warn) s += ' outline: 2px solid ' + t.danger + '; outline-offset: -2px;';
      if (o.ghost) s = s.replace('background: ' + bg, 'background: transparent') + ' border: 1.5px dashed ' + t.accent + ';';
      return { style: s, title, time };
    };
    const su = ev(9, 9.5, 'Stand-up', '', 'm');
    const days = [
      { dow:'Mon', num:'9', ev:[su, ev(10, 11.5, 'Sprint planning', '10:00 – 11:30', 'm'), ev(14, 16, 'Draft hiring plan', '14:00 – 16:00', 'f')] },
      { dow:'Tue', num:'10', ev:[su, ev(10, 11, 'Q4 roadmap', '10:00 – 11:00', 'f'), ev(12.5, 13.5, 'Lunch and learn', '12:30', 'p'), ev(15, 16, 'Vendor call', '15:00 – 16:00', 'm')] },
      { dow:'Wed', num:'11', ev:[su, ev(11, 12.5, 'Architecture review', '11:00 – 12:30', 'm', { right: '50%', warn: true }), ev(11.5, 12.5, 'Test plan', 'Overlaps', 'f', { left: '50%', warn: true })] },
      { dow:'Thu', num:'12', today:true, now:true, ev:[su, ev(10, 11.5, 'Review Q4 roadmap deck', '10:00 – 11:30', 'f'), ev(12.5, 13.25, 'Lunch', '', 'p'), ev(14, 15, '1:1 with Priya', '14:00 – 15:00', 'm'), ev(15.5, 16.5, 'Update test plan', '15:30 – 16:30', 'f')] },
      { dow:'Fri', num:'13', ev:[su, ev(10, 11, 'Prepare sprint demo', 'Dropping · 10:00', 'f', { ghost: true }), ev(14, 15, 'Sprint demo', '14:00 – 15:00', 'm'), ev(16.5, 17, 'Weekly status', '', 'f')] },
      { dow:'Sat', num:'14', weekend:true, ev:[ev(9, 10, 'Gym', '9:00', 'p')] },
      { dow:'Sun', num:'15', weekend:true, ev:[] }
    ].map(d => ({ ...d, now: !!d.now, bg: d.weekend ? t.bg : 'transparent',
      numStyle: d.today ? 'font-size: 15px; font-weight: 600; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: ' + t.accentFill + '; color: ' + t.onAccent : 'font-size: 15px; font-weight: 600; height: 28px; display: flex; align-items: center' }));
    const hours = [];
    for (let i = 0; i <= 10; i++) hours.push({ top: i * H, label: (8 + i) + ':00' });
    const pstyle = (drag) => 'display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 13px; background: ' + t.surface + '; border: 1px solid ' + (drag ? t.accent : t.border) + ';' + (drag ? ' opacity: 0.55;' : '');
    const pool = ['Prepare sprint demo', 'Draft hiring plan for Q1', 'Clean up shared drive folders', 'Read architecture review notes', 'Book dentist appointment'].map((title, i) => ({ title, style: pstyle(i === 0) }));
    return { theme, t, days, hours, pool, monthHref: theme === 'dark' ? 'Month-Dark.dc.html' : 'Month.dc.html' };
  }
}
</script>
</body>
</html>
