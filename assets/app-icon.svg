<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>My To-Do : Daily Planner</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FAE72"/>
      <stop offset="1" stop-color="#137447"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F4A62A"/>
    </linearGradient>
  </defs>

  <!-- Planner page tile -->
  <rect x="40" y="64" width="432" height="416" rx="104" fill="url(#tile)"/>

  <!-- Planner binder rings -->
  <rect x="148" y="28" width="44" height="92" rx="22" fill="#0E5A37"/>
  <rect x="320" y="28" width="44" height="92" rx="22" fill="#0E5A37"/>
  <rect x="158" y="38" width="24" height="54" rx="12" fill="#2FAE72"/>
  <rect x="330" y="38" width="24" height="54" rx="12" fill="#2FAE72"/>

  <!-- Tick mark: one continuous stroke -->
  <path d="M142 300 L222 378 L350 230" fill="none" stroke="#FFFFFF"
        stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The unique touch: the tick's rising stroke ends in a morning sun -->
  <circle cx="394" cy="180" r="38" fill="url(#sun)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
